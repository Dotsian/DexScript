site_name: DexScript Wiki
repo_url: https://github.com/Dotsian/DexScript
repo_name: Dotsian/DexScript

theme:
  name: material
  palette:
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Dark mode

    - scheme: default
      toggle:
        icon: material/weather-night
        name: Light mode

  highlightjs: false

  features:
    - content.code.annotate
    - content.tooltips
    - navigation.instant
    - navigation.tabs
    - navigation.path
    - navigation.top
    - navigation.sections
    - navigation.indexes
    - content.tabs.link
    - content.code.select
    - content.code.copy

  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Extensions:
      - Global: extensions/global.md
      - File: extensions/file.md
      - Global: 
          - Edit: commands/edit.md
          - Delete: commands/delete.md
          - Update: commands/update.md
      - File:
          - Write: commands/write.md


markdown_extensions:
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - abbr
  - attr_list
  - admonition
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true

plugins:
  - search
  - dexscript

extra_css:
  - assets/css/dexscript.css