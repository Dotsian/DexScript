name: Bug Report
description: Report a DexScript bug
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a DexScript bug!
  - type: checkboxes
    attributes:
      label: Error Page
      description: The [error page](https://github.com/Caylies/DexScript/wiki/Errors) explains what common errors mean and how to solve them.
      options:
        - label: Did you read the error page and view the common errors?
          required: true
  - type: dropdown
    id: location
    attributes:
      label: Bug Location
      description: Where did this bug occur? If you select "Other", please specify in the Bug Description section.
      options:
        - When trying to run a command.
        - When using a text command, such as "[p]about".
        - When trying to turn on the bot.
        - Other (please specify in the Bug Description section)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Explain the bug and what happened before it appeared.
      placeholder: Bug explanation...
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Version
      description: Add your DexScript version number here. You can fetch it using the `[p]about` command.
      placeholder: Version number...
    validations:
      required: true
  - type: dropdown
    id: bdversion
    attributes:
      label: Which major Ballsdex version are you using?
      options:
        - "3.0"
        - "2.0"
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error Output
      description: If there was an error, paste it below.
      render: shell
