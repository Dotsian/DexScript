[project]
name = "dexscript"
version = "0.5.1"
description = "A DSL package for Ballsdex created by Cayla that allows you to easily perform operations on balls, regimes, specials, etc."
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Cayla", email = "official.dotzz@gmail.com" },
]
readme = "README.md"

dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]

[tool.setuptools]
packages = ["DexScript"]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py313"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E203"]

[tool.ruff.lint.isort]
known-first-party = ["ballsdex", "bd_models", "settings"]
split-on-trailing-comma = false

[project.urls]
Homepage = "https://github.com/Caylies/DexScript"
